name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source
        run: bun run check
      - name: Smoke-test npm package
        run: bun run test:package
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Run browser acceptance
        run: bun run test:e2e
      - name: Compile release binaries
        run: bun run build:release
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(bun -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "${expected}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}." >&2
            exit 1
          }
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          version="v$(bun -p 'require("./package.json").version')"
          mkdir -p release/stage
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            mkdir -p "release/stage/${platform}"
            cp "dist/folio-${platform}" README.md LICENSE CHANGELOG.md SECURITY.md THIRD_PARTY_NOTICES.md "release/stage/${platform}/"
            tar -C "release/stage/${platform}" -czf "release/folio-${version}-${platform}.tar.gz" .
          done
          for platform in windows-arm64 windows-x64; do
            mkdir -p "release/stage/${platform}"
            cp "dist/folio-${platform}.exe" README.md LICENSE CHANGELOG.md SECURITY.md THIRD_PARTY_NOTICES.md "release/stage/${platform}/"
            (cd "release/stage/${platform}" && zip -q "../../folio-${version}-${platform}.zip" ./*)
          done
          cd release
          sha256sum folio-*.tar.gz folio-*.zip > SHA256SUMS
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folio-binaries
          path: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.tar.gz release/*.zip release/SHA256SUMS --generate-notes --verify-tag

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: npm publish --access public --provenance
