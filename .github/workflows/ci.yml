name: CI

on:
  push: {}
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Smoke-test standalone Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDirectory = Join-Path $env:RUNNER_TEMP 'folio-bin'
          bun run scripts/install.ts --bin-dir $binDirectory
          if ($LASTEXITCODE -ne 0) { throw "Folio installer exited with $LASTEXITCODE." }

          $binary = Join-Path $binDirectory 'folio.exe'
          $actualVersion = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Folio binary exited with $LASTEXITCODE." }

          $expectedVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($actualVersion -ne $expectedVersion) {
            throw "Expected Folio $expectedVersion, received '$actualVersion'."
          }

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run test:package

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
